name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.1

      - name: Build wheels
        env:
          BENCODER_LIMITED_API: "0"
          CIBW_ENVIRONMENT: "BENCODER_LIMITED_API=0"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_abi3:
    name: Build ABI3 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install cibuildwheel and abi3audit
        run: python -m pip install cibuildwheel==4.2.1 abi3audit

      - name: Build ABI3 wheel
        env:
          BENCODER_LIMITED_API: "1"
          CIBW_BUILD: "cp314-*"
          CIBW_ENVIRONMENT: "BENCODER_LIMITED_API=1"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Audit ABI3 wheels
        shell: python
        run: |
          import glob
          import subprocess
          for wheel in glob.glob("wheelhouse/*.whl"):
              subprocess.run(["abi3audit", "--strict", wheel], check=True)

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-abi3-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build SDist
      run: pipx run build --sdist
    - name: Check distribution
      run: pipx run twine check dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  test_abi3:
    name: Test ABI3 wheel on Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: build_abi3
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.14", "3.x"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-abi3-${{ matrix.os }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Install ABI3 wheel and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links wheelhouse bencoder.pyx

      - name: Run tests against the installed ABI3 wheel
        run: python -m pytest -q tests

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs: [build_wheels, build_abi3, test_abi3, make_sdist]
    environment:
      name: release
      url: https://pypi.org/p/bencoder.pyx
    permissions:
      id-token: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1